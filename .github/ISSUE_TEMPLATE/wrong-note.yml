name: Wrong or missing note
description: A fingering plays the wrong note, no note, or a note that should have an alternate fingering.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Keys are numbered like the fingering check (`tools/fingering-check/tests.swift`):
        **1-3** left-hand fingers, **4-5** G# keys, **6-8** right-hand fingers, **9** Eb key, **10** low C key.
  - type: input
    id: keys
    attributes:
      label: Keys pressed
      placeholder: "e.g. 1, 2, 6"
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Note you expected (written pitch)
      placeholder: "e.g. Bb4"
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: What VEWI played
      placeholder: "e.g. A4, or nothing"
  - type: dropdown
    id: transposition
    attributes:
      label: Transposition setting
      options: [C (concert), Bb, Eb, Not sure]
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Device, iOS version, or how the fingering is played on a real sax.
