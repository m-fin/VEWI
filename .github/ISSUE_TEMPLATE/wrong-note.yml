name: Wrong or missing note
description: A fingering plays the wrong note, no note, or a note that should have an alternate fingering.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Name the keys the way the fingering chart does (`tools/fingering-check/main.swift`):
        **L1 L2 L3** left hand, **R1 R2 R3** right hand, **Oct** octave, **Bis**, pinky keys, palm keys, **side B♭ / side C / front E / F♯ key**.
  - type: input
    id: keys
    attributes:
      label: Keys pressed
      placeholder: "e.g. L1 Bis"
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Note you expected (written pitch)
      placeholder: "e.g. Bb4"
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: What VEWI played
      placeholder: "e.g. A4, or nothing"
  - type: dropdown
    id: transposition
    attributes:
      label: Transposition setting
      options: [C (concert), Bb, Eb, Not sure]
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Device, iOS version, or how the fingering is played on a real sax.
